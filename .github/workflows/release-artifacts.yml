name: Release artifacts
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional tracking ID; leave empty when running from this page'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  plan:
    name: Validate release configuration
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      version: ${{ steps.config.outputs.version }}
      prerelease: ${{ steps.config.outputs.prerelease }}
      asset_count: ${{ steps.config.outputs.asset_count }}
      package_counts: ${{ steps.config.outputs.package_counts }}
      summary: ${{ steps.config.outputs.summary }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve version and native build matrix
        id: config
        run: node scripts/release-config.mjs

  build:
    name: Build ${{ matrix.id }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      INTERCEPTOR_BUILD_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Prepare WiX 3.14.1
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./scripts/prepare-wix.ps1 -Destination "$env:RUNNER_TEMP/wix314"
      - run: npm run build:core
      - run: npm run build:native --workspace @interceptor/desktop
      - run: npm run typecheck
      - run: npm run test --workspaces --if-present -- --no-file-parallelism
      - run: npm run release:build -- --target "${{ matrix.id }}"
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interceptor-release-${{ matrix.id }}
          path: apps/desktop/out/release/${{ matrix.id }}/Interceptor-${{ needs.plan.outputs.version }}-${{ matrix.id }}.*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: interceptor-diagnostics-${{ matrix.id }}
          path: apps/desktop/test-results/**/*
          if-no-files-found: ignore
      - name: Record remaining release acceptance
        if: always()
        shell: bash
        run: |
          {
            echo "## Remaining release acceptance"
            echo "Only the configured native target and package types were built."
            echo "macOS uses ad-hoc signing without Apple notarization; Windows installers are unsigned."
            echo "Packaged smoke, browser-download installation, native authorization, installer lifecycle and exit restoration require the corresponding real platform before publishing."
            echo "Those manual checks are not reported as passed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Prepare draft Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: interceptor-release-*
          path: release-assets
          merge-multiple: true
      - name: Attach verified artifacts to a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SUMMARY: ${{ needs.plan.outputs.summary }}
          EXPECTED_ASSET_COUNT: ${{ needs.plan.outputs.asset_count }}
          EXPECTED_PACKAGE_COUNTS: ${{ needs.plan.outputs.package_counts }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f -print0)
          test "${#ASSETS[@]}" -eq "$EXPECTED_ASSET_COUNT"
          for TYPE in dmg zip msi; do
            EXPECTED=$(jq -r --arg type "$TYPE" '.[$type]' <<< "$EXPECTED_PACKAGE_COUNTS")
            test "$(find release-assets -type f -name "*.$TYPE" | wc -l)" -eq "$EXPECTED"
          done
          for ASSET in "${ASSETS[@]}"; do
            DIGEST="sha256:$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
            jq -n --arg name "$(basename "$ASSET")" --arg digest "$DIGEST" \
              --argjson size "$(stat -c %s "$ASSET")" \
              '{key: $name, value: {digest: $digest, size: $size}}'
          done | jq -s 'from_entries' > expected-assets.json

          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
            jq -sc --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]')
          if jq -e 'length == 0' <<< "$EXISTING" >/dev/null; then
            FLAGS=()
            if test "$PRERELEASE" = true; then FLAGS+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              "${FLAGS[@]}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --notes "Targets: $TARGET_SUMMARY. macOS is ad-hoc signed and not notarized; Windows installers are unsigned. macOS built-in updates require a DMG for the matching architecture; ZIP-only builds are for manual download. Verify the download source and integrity before using per-app approval; do not disable system-wide security. Helper and CA permissions are separate. Complete real installation, packaged smoke, authorization, installer lifecycle and exit-restoration acceptance on every included platform before publishing this draft." \
              --title "Interceptor ${GITHUB_REF_NAME#v}"
          elif jq -e 'length == 1 and .[0].draft == true' <<< "$EXISTING" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            echo "Refusing to overwrite an already published Release. Use a new version tag." >&2
            exit 1
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
            jq -es --arg tag "$GITHUB_REF_NAME" \
              --argjson count "$EXPECTED_ASSET_COUNT" \
              --argjson prerelease "$PRERELEASE" \
              --slurpfile expected expected-assets.json '
              [.[][] | select(.tag_name == $tag)] |
              length == 1 and
              (.[0] |
                .draft == true and
                .prerelease == $prerelease and
                (.assets | length == $count) and
                all(.assets[];
                  . as $asset |
                  .state == "uploaded" and
                  .size > 0 and
                  (.digest | type == "string") and
                  .digest == $expected[0][$asset.name].digest and
                  .size == $expected[0][$asset.name].size
                )
              )'
          {
            echo "## Draft Release prepared"
            echo "The configured artifacts are staged, not published."
            echo "Complete installation and restoration acceptance on every included platform, then publish the draft manually."
          } >> "$GITHUB_STEP_SUMMARY"