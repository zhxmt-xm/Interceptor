name: Release artifacts
run-name: Release ${{ inputs.request_id || inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full source commit SHA already available in this repository'
        required: true
        type: string
      version:
        description: 'Installer version, without the v prefix'
        required: true
        type: string
      targets:
        description: 'Target JSON generated by npm run release'
        required: true
        type: string
      request_id:
        description: 'Optional tracking ID'
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Validate selected source and targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      source_sha: ${{ steps.config.outputs.source_sha }}
      targets: ${{ steps.config.outputs.targets }}
      version: ${{ steps.config.outputs.version }}
      prerelease: ${{ steps.config.outputs.prerelease }}
      asset_count: ${{ steps.config.outputs.asset_count }}
      package_counts: ${{ steps.config.outputs.package_counts }}
      summary: ${{ steps.config.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate immutable source SHA and build request
        id: config
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGETS: ${{ inputs.targets }}
        run: node scripts/release-config.mjs
      - name: Verify source commit exists on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.config.outputs.source_sha }}
        run: |
          RESOLVED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.sha')
          test "$RESOLVED" = "$SOURCE_SHA"

  build:
    name: Build ${{ matrix.id }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
      INTERCEPTOR_BUILD_VERSION: ${{ needs.plan.outputs.version }}
      INTERCEPTOR_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
      RELEASE_TOOLING_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out the workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - name: Prepare the tooling runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Retain only the release tools outside the source checkout
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFile, copyFile, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'interceptor-release-tools');
          for (const file of [
            'scripts/release-config.mjs',
            'scripts/release-build.mjs',
            'scripts/windows-bootstrapper.nsi',
            'apps/desktop/tests/installer/macos-release-smoke.mjs',
            'apps/desktop/tests/installer/package-artifact-audit.mjs',
          ]) {
            const target = path.join(root, file);
            await mkdir(path.dirname(target), { recursive: true });
            await copyFile(file, target);
          }
          await appendFile(process.env.GITHUB_ENV, `RELEASE_TOOLING_DIRECTORY=${root}\n`, 'utf8');
          JS
      - name: Check out exactly the selected product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Confirm source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Prepare WiX 3.14.1
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./scripts/prepare-wix.ps1 -Destination "$env:RUNNER_TEMP/wix314"
      - name: Prepare NSIS 3.11 and 7-Zip
        if: matrix.platform == 'win32' && contains(needs.plan.outputs.targets, '"exe"')
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $directory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $compiler = Join-Path $directory 'makensis.exe'
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler is missing.' }
          $version = & $compiler /VERSION
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -notmatch '^v?3\.11(?:\.0)?$') {
            throw "Unexpected NSIS compiler version: $version"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $directory
          Get-Command 7z.exe -ErrorAction Stop
      - run: npm run build:core
      - run: npm run build:native --workspace @interceptor/desktop
      - run: npm run typecheck
      - run: npm run test --workspaces --if-present -- --no-file-parallelism
      - name: Build selected packages using the retained tooling
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.id }}
        run: node "$RELEASE_TOOLING_DIRECTORY/scripts/release-build.mjs" --target "$RELEASE_TARGET"
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interceptor-release-${{ matrix.id }}
          path: apps/desktop/out/release/${{ matrix.id }}/Interceptor-${{ needs.plan.outputs.version }}-${{ matrix.id }}.*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interceptor-diagnostics-${{ matrix.id }}
          path: apps/desktop/test-results/**/*
          if-no-files-found: ignore
      - name: Record source and remaining acceptance
        if: always()
        shell: bash
        run: |
          {
            echo "## Release source"
            echo "Product commit: $RELEASE_SOURCE_SHA"
            echo "Workflow tooling commit: $RELEASE_TOOLING_SHA"
            echo "Only the selected native target and packages were built."
            echo "macOS is ad-hoc signed without notarization; Windows installers are unsigned."
            echo "Real download, installation, native authorization, packaged smoke and exit restoration remain manual gates before Publish."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag selected source and prepare draft
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: interceptor-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify artifacts and bind the tag to the selected SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RELEASE_TAG: v${{ needs.plan.outputs.version }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          TARGET_SUMMARY: ${{ needs.plan.outputs.summary }}
          EXPECTED_ASSET_COUNT: ${{ needs.plan.outputs.asset_count }}
          EXPECTED_PACKAGE_COUNTS: ${{ needs.plan.outputs.package_counts }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f -print0)
          test "${#ASSETS[@]}" -eq "$EXPECTED_ASSET_COUNT"
          for TYPE in dmg zip msi exe; do
            EXPECTED=$(jq -r --arg type "$TYPE" '.[$type]' <<< "$EXPECTED_PACKAGE_COUNTS")
            test "$(find release-assets -type f -name "*.$TYPE" | wc -l)" -eq "$EXPECTED"
          done
          for ASSET in "${ASSETS[@]}"; do
            DIGEST="sha256:$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
            jq -n --arg name "$(basename "$ASSET")" --arg digest "$DIGEST" \
              --argjson size "$(stat -c %s "$ASSET")" \
              '{key: $name, value: {digest: $digest, size: $size}}'
          done | jq -s 'from_entries' > expected-assets.json

          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
            jq -sc --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')
          if ! jq -e 'length == 0 or (length == 1 and .[0].draft == true)' <<< "$EXISTING" >/dev/null; then
            echo "Refusing to overwrite an already published Release." >&2
            exit 1
          fi
          REFS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" |
            jq --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)]')
          if jq -e 'length == 0' <<< "$REFS" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          TAG_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          test "$TAG_SOURCE" = "$SOURCE_SHA"

          if jq -e 'length == 0' <<< "$EXISTING" >/dev/null; then
            FLAGS=()
            if test "$PRERELEASE" = true; then FLAGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" "${FLAGS[@]}" \
              --draft --verify-tag --target "$SOURCE_SHA" --generate-notes \
              --notes "Source commit: $SOURCE_SHA. Targets: $TARGET_SUMMARY. macOS is ad-hoc signed and not notarized; Windows installers are unsigned. Windows EXE embeds and launches the same MSI without separate app registration. ZIP packages require extraction. Built-in updates require a matching macOS DMG or Windows MSI. EXE and ZIP are for manual distribution. Complete real installation, authorization, packaged smoke and exit-restoration acceptance on every included platform before publishing. Do not disable system-wide security protections." \
              --title "Interceptor $RELEASE_VERSION"
          else
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
            jq -es --arg tag "$RELEASE_TAG" --argjson count "$EXPECTED_ASSET_COUNT" \
              --argjson prerelease "$PRERELEASE" --slurpfile expected expected-assets.json '
              [.[][] | select(.tag_name == $tag)] |
              length == 1 and
              (.[0] | .draft == true and .prerelease == $prerelease and
                (.assets | length == $count) and
                all(.assets[]; . as $asset |
                  .state == "uploaded" and .size > 0 and
                  (.digest | type == "string") and
                  .digest == $expected[0][$asset.name].digest and
                  .size == $expected[0][$asset.name].size
                )
              )'
          {
            echo "## Draft prepared"
            echo "Tag $RELEASE_TAG points to product commit $SOURCE_SHA."
            echo "The assets are staged, not published. Complete real-platform acceptance before Publish."
          } >> "$GITHUB_STEP_SUMMARY"
